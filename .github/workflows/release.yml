name: Release to GitHub and npm

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # npm provenance

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Dispatch on the release tag so the OIDC source commit matches the package.
    if: startsWith(github.ref, 'refs/tags/v') && github.actor_id == '243264979' && github.triggering_actor == 'breathi3552'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Validate immutable release source
        id: version
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "refs/tags/$tag^{commit}")" = "$GITHUB_SHA"
          git merge-base --is-ancestor HEAD origin/main
          version="$(node -p 'require("./package.json").version')"
          lock_version="$(node -p 'require("./package-lock.json").version')"
          root_version="$(node -p 'require("./package-lock.json").packages[""].version')"
          test "$tag" = "v$version" && test "$version" = "$lock_version" && test "$version" = "$root_version"
          test -f "docs/releases/$version.md"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Run quality guardrails
        run: |
          npm run check
          git diff --exit-code

      - name: Publish to npm (skip an existing version on retry)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          status="$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { name, version } = JSON.parse(readFileSync("package.json"));
            const response = await fetch(`https://registry.npmjs.org/${name}/${version}`);
            if (response.status === 404) console.log("missing");
            else if (response.ok) console.log("published");
            else throw new Error(`npm registry returned ${response.status}`);
          ')"
          if [[ "$status" == "published" ]]; then
            echo 'Version already exists; verifying it before creating the GitHub Release'
          else
            if [[ -z "$NODE_AUTH_TOKEN" ]]; then
              echo 'Configure the NPM_TOKEN Actions secret with publish permission and Bypass 2FA' >&2
              exit 1
            fi
            npm publish --provenance --access public
          fi

      - name: Verify npm artifact and provenance against the tag
        env:
          RELEASE_ARTIFACT_DIR: ${{ runner.temp }}/release-artifact
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/verify-release.mjs > "$RUNNER_TEMP/release-verification.md"
          cat "$RUNNER_TEMP/release-verification.md"
          {
            cat "docs/releases/$VERSION.md"
            printf '\n## Verified artifact\n\n'
            cat "$RUNNER_TEMP/release-verification.md"
          } > "$RUNNER_TEMP/release-notes.md"

      - name: Verify npm registry and provenance signatures
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/release-audit" --ignore-scripts --omit=dev --no-audit --no-fund --registry=https://registry.npmjs.org "paseo-kanban@$VERSION"
          cd "$RUNNER_TEMP/release-audit"
          npm audit signatures --registry=https://registry.npmjs.org
          printf '\n- Registry and provenance signatures: verified with `npm audit signatures`.\n' >> "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub Release with the verified npm tarball
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$TAG" "$RUNNER_TEMP/release-artifact/paseo-kanban-$VERSION.tgz" --clobber
